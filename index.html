<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Spire</title><link rel="stylesheet" href="/src/style.css"></head><body><div id="app"><div id="menu-overlay" style="position:fixed;inset:0;background:rgba(3,6,12,.92);display:flex;align-items:center;justify-content:center;z-index:20;"><div style="text-align:center;max-width:420px;padding:32px;"><h1 style="letter-spacing:4px;">ECHO SPIRE</h1><p>Best cycle: <b id="menu-best">0</b></p><p>Cores: <b id="menu-cores">0</b></p><button id="btn-launch">Launch Mothership</button><button id="btn-menu-workshop">Workshop</button><div id="workshop" style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;"><button id="btn-ws-dmg">Railguns</button><button id="btn-ws-rate">Targeting</button><button id="btn-ws-maxHull">Hull Plating</button><button id="btn-ws-range">Sensors</button><button id="btn-ws-regen">Nanobots</button><button id="btn-ws-crit">Lucky Shot</button><button id="btn-ws-volley">Volley</button><button id="btn-ws-bounce">Split Rounds</button></div></div></div><div id="over-overlay" style="display:none;position:fixed;inset:0;background:rgba(3,6,12,.9);align-items:center;justify-content:center;z-index:20;"><div style="text-align:center;min-width:300px;padding:24px;background:#0b1220;border:1px solid #5eead4;border-radius:12px;"><h2>MOTHERSHIP LOST</h2><p>Wave <b id="over-wave">0</b> • <b id="over-kills">0</b> kills</p><p>Flux <b id="over-flux">0</b> • Essence <b id="over-essence">0</b> • <b id="over-time">0s</b></p><p>Cores earned <b id="over-cores">0</b></p><button id="btn-relaunch">Relaunch</button><button id="btn-over-menu">Menu</button></div></div><div id="topbar"><span>Cycle <b id="hud-wave">1</b></span><span>Hull <b id="hud-hull">500/500</b></span><span>Flux <b id="hud-flux">0</b></span><span>Essence <b id="hud-essence">0</b></span><span>Cores <b id="hud-cores">0</b></span></div><div id="layout"><canvas id="game" style="width:560px;height:560px"></canvas><aside id="side"><h3>Forge</h3><button id="buy-dmg">Railguns +dmg (<span id="cost-dmg">20</span> flux)</button><button id="buy-rate">Targeting +rate (<span id="cost-rate">30</span> flux)</button><button id="buy-maxHull">Hull +max (<span id="cost-maxHull">25</span> flux)</button><h3>Dock</h3><div id="dock"><button id="btn-pause">Pause</button><button id="btn-speed-1">x1</button><button id="btn-speed-2">x2</button><button id="btn-speed-4">x4</button><button id="btn-collapse">Collapse</button></div></aside></div><div id="augment-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;"><div style="background:#0b1220;border:1px solid #5eead4;border-radius:8px;padding:16px;min-width:280px;"><h3>Choose Augment</h3><div id="augment-opts" style="display:flex;flex-direction:column;gap:8px;"></div></div></div></div><script type="module" src="/src/main.ts"></script></body></html>
